  <body>
    <!-- Hardware-level simulated DRM Blackout Plane (Netflix style) -->
    <div id="netflix-drm-shield">
      <div class="netflix-shield-content">
        <div class="netflix-shield-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <div class="netflix-shield-title">Protected Content</div>
        <div class="netflix-shield-desc">
          Screen capture and recording are blocked.<br />View-only on authorized device.
        </div>
        <button id="netflix-shield-resume-btn" type="button" class="netflix-shield-btn">
          Tap to Resume
        </button>
      </div>
    </div>
    <div id="root">
      <div id="loading-indicator" style="background: #0f172a; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-family: sans-serif;">
        <img src="./pwa-192x192.png" alt="UCC Lancers" style="height: 88px; width: 88px; object-fit: contain; margin-bottom: 16px;" onerror="this.src='/lancer-logo.png'" />
        <div style="font-size: 24px; font-weight: 800; letter-spacing: 0.1em; color: #6366f1;">UCC LANCERS</div>
        <div style="margin-top: 10px; opacity: 0.5; font-size: 14px;">Loading Dashboard...</div>
      </div>
    </div>
    <script>
      (function() {
        var shield = document.getElementById('netflix-drm-shield');
        var resumeBtn = document.getElementById('netflix-shield-resume-btn');
        function dismissShield(e) {
          if (e) e.stopPropagation();
          document.documentElement.classList.remove('shield-active');
          document.body.classList.remove('shield-active');
        }
        if (resumeBtn) resumeBtn.addEventListener('click', dismissShield);
        if (shield) shield.addEventListener('click', dismissShield);
      })();
    </script>
  </body>
